<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мутанты: Генетические гладиаторы</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Alegreya+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e4dbe9;--ink:#241a33;--card:#d3c7de;--line:#a994c0;--acc:#7a3fa0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15101f;--ink:#e9e0f2;--card:#241a33;--line:#44335c;--acc:#b98be0}}
:root[data-theme="dark"]{--bg:#15101f;--ink:#e9e0f2;--card:#241a33;--line:#44335c;--acc:#b98be0}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 'Alegreya Sans',system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:8px 8px 20px}
#stage{position:relative;--u:1;font-family:Oswald,'Arial Narrow',sans-serif;overflow:hidden;border-radius:10px;border:2px solid var(--line);background:#12101a;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;aspect-ratio:480/372;image-rendering:pixelated;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
.top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:calc(var(--u)*6px);pointer-events:none!important}
.pill{background:linear-gradient(90deg,#0e0a18,#2c1f42);color:#fff;font-weight:700;font-size:calc(var(--u)*17px);padding:calc(var(--u)*3px) calc(var(--u)*14px);clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%);letter-spacing:.5px}
.bot{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:calc(var(--u)*6px);pointer-events:none!important}
.bot button,.mi button.big{pointer-events:auto;border:0;cursor:pointer;color:#fff;font:italic 700 calc(var(--u)*20px) Oswald,sans-serif;padding:calc(var(--u)*8px) calc(var(--u)*22px);background:linear-gradient(#6a3d98,#34205a);clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}
#ov{position:absolute;inset:0;pointer-events:none!important}
#ov>*,#ov button{pointer-events:auto}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
.hexb{position:relative;border:0;padding:0;cursor:pointer;width:calc(var(--u)*50px);height:calc(var(--u)*56px);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(#d2a8ff,#5a3a85)}
.hexb>i{position:absolute;inset:calc(var(--u)*3px);clip-path:inherit;background:radial-gradient(#3a2a55,#140e22);display:grid;place-items:center;font-style:normal;font-size:calc(var(--u)*24px)}
.pic{image-rendering:pixelated;background-repeat:no-repeat}
.badge{position:absolute;right:calc(var(--u)*-2px);bottom:calc(var(--u)*14px);font-size:calc(var(--u)*13px);font-weight:700;color:#fff;background:#2a7fb8;border-radius:999px;padding:0 calc(var(--u)*6px);z-index:2;pointer-events:none}
.rib{margin-top:calc(var(--u)*-6px);position:relative;z-index:1;background:rgba(12,8,22,.9);color:#fff;font-weight:700;font-size:calc(var(--u)*13px);padding:0 calc(var(--u)*12px);white-space:nowrap;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
.menu{position:absolute;left:0;right:0;bottom:calc(var(--u)*46px);display:flex;justify-content:center;gap:calc(var(--u)*14px);pointer-events:none!important}
.menu .slot{position:static;transform:none;pointer-events:auto}
.menu button.hexb{font-size:0}
#sheet{position:absolute;left:0;right:0;bottom:0;background:rgba(12,8,22,.94);padding:calc(var(--u)*10px);display:none;grid-template-columns:repeat(4,1fr);gap:calc(var(--u)*6px);z-index:5;color:#fff}
#sheet.on{display:grid}
#sheet button{border:1px solid #5a3a85;background:#1c1430;color:#fff;border-radius:8px;padding:calc(var(--u)*6px) 2px;font:inherit;font-size:calc(var(--u)*13px);cursor:pointer;line-height:1.2}
#sheet button b{display:block;font-size:calc(var(--u)*26px)}
#sheet button:disabled{opacity:.4}
#sheet .wide{grid-column:1/-1}
#msg{min-height:22px;font-size:15px;margin:6px 2px;color:var(--acc);font-weight:700}
#panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:110px}
#panel h2{font:700 20px/1.1 Oswald,sans-serif;margin:0 0 4px}
.bar{display:grid;grid-template-columns:70px 1fr 30px;gap:6px;align-items:center;font-size:14px}
.bar i{display:block;height:7px;border-radius:4px;background:var(--line);overflow:hidden}.bar i s{display:block;height:100%;background:var(--acc)}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.row button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
.row button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
</style></head><body><main>
<div id="stage"><canvas id="cv" width="960" height="744" aria-label="Питомник"></canvas>
<div id="hud"><div class="top"><div class="pill" id="gold"></div><div class="pill" id="lv"></div></div>
<div id="ov"></div>
<div class="bot"><button id="bm">Меню</button><button id="bs">🛒 Магазин</button></div>
<div id="sheet"></div></div></div>
<div id="msg"></div>
<div id="panel"></div>
</main>

 den:{n:'Каменная нора',e:'🪨',fav:'orc',cost:100,col:'#b59a74'},
 forge:{n:'Адская кузня',e:'🔥',fav:'demon',cost:140,col:'#ff7a45'},
 pond:{n:'Кровавый пруд',e:'🩸',fav:'blood',cost:140,col:'#e0405c'},
 barracks:{n:'Казарма',e:'⚔️',fav:'soldier',cost:120,col:'#6fa8e8'}};
const KINDS={
 orc:{n:'Орк',hp:120,atk:14,def:8,spd:5,gene:'Ярость'},
 demon:{n:'Демон',hp:90,atk:18,def:5,spd:7,gene:'Пламя'},
 blood:{n:'Кровавый монстр',hp:140,atk:11,def:9,spd:4,gene:'Регенерация'},
 soldier:{n:'Мутант-солдат',hp:100,atk:12,def:11,spd:6,gene:'Дисциплина'}};
const SHORT={orc:'Орк',demon:'Демон',blood:'Кровавый',soldier:'Солдат'};
const SLOTS=[[.3,2.7],[2.7,.3],[3,3]];
const IMG={};for(const k in SPR){IMG[k]={};for(const a of ['idle','walk','atk'])(IMG[k][a]=new Image()).src=SPR[k][a].src}
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
let gold,xp,lvl,pens,mons,sel=null,build=null,moving=null,reloc=false,ghost=null,uid=1,incT=0,sheet=null;
const rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const P=(c,r)=>[OX+(c-r)*TW/2,OY+(c+r)*TH/2];
const tileAt=(x,y)=>{const u=(x-OX)/(TW/2),v=(y-OY)/(TH/2);return[Math.floor((u+v)/2),Math.floor((v-u)/2)]};
function fresh(){gold=520;xp=0;lvl=1;pens=[];mons=Object.keys(KINDS).map(k=>mk(k,SHORT[k]+' 01'));sel=null;build=null;moving=null;reloc=false}
function mk(kind,name){const m={id:uid++,kind,name,c:rnd(1,N-1),r:rnd(1,N-1),pen:null,coins:0,anim:'idle',t:0,dir:1,wait:rnd(0,2),atkT:rnd(6,14)};pick(m);return m}
function region(m){const p=pens.find(p=>p.id===m.pen);return p?[p.c+.6,p.c+2.4,p.r+1.1,p.r+2.5]:[.5,N-.5,.5,N-.5]}
function pick(m){const g=region(m);m.tc=rnd(g[0],g[1]);m.tr=rnd(g[2],g[3])}
function comfort(m){const p=pens.find(p=>p.id===m.pen);return !p?20:HOUSES[p.type].fav===m.kind?100:55}
function mood(m){const c=comfort(m);return c>=100?'доволен':c>=50?'терпит':'тоскует без дома'}
function say(t){$('msg').textContent=t}
function save(){try{localStorage.setItem('mgg3',JSON.stringify({gold,xp,lvl,pens,mons}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('mgg3'));if(d&&d.pens&&d.mons){({gold,xp,lvl,pens,mons}=d);uid=1+Math.max(0,...pens.map(p=>p.id),...mons.map(m=>m.id));mons.forEach(pick);return true}}catch(e){}return false}
function fits(c,r,ig){if(c<0||r<0||c+PEN>N||r+PEN>N)return false;return pens.every(p=>p===ig||c+PEN<=p.c||p.c+PEN<=c||r+PEN<=p.r||p.r+PEN<=r)}
const penCoins=p=>mons.filter(m=>m.pen===p.id).reduce((s,m)=>s+Math.floor(m.coins),0);
const total=()=>mons.reduce((s,m)=>s+Math.floor(m.coins),0);
function collect(list){let n=0;list.forEach(m=>{n+=Math.floor(m.coins);m.coins=0});if(!n){say('Монет пока нет.');return}gold+=n;xp+=n;while(xp>=lvl*100){xp-=lvl*100;lvl++}say('+'+n+' 🪙');save();hud()}
function hud(){$('gold').textContent='🪙 '+gold;$('lv').textContent='Ур. '+lvl+' · '+xp+'/'+lvl*100;ov();panel()}
function pic(k,z){const s=SPR[k],a=s.idle;return `<div class="pic" style="width:${s.w*z}px;height:${s.h*z}px;background-image:url(${a.src});background-size:${a.n*s.w*z}px ${s.h*z}px"></div>`}
function ov(){const el=$('ov');if(!(sel&&sel.t==='p')){el.innerHTML='';return}
 const p=pens.find(p=>p.id===sel.id);if(!p){el.innerHTML='';return}
 const res=mons.filter(m=>m.pen===p.id);let h='';
 res.forEach((m,i)=>{const[x,y]=P(p.c+SLOTS[i][0],p.r+SLOTS[i][1]);
  h+=`<div class="slot" style="left:${x/CW*100}%;top:${cl(y-10,40,CH-30)/CH*100}%"><button class="hexb" data-a="m${m.id}"><i>${pic(m.kind,1.1)}</i></button><span class="badge" data-b="${m.id}">✋${Math.floor(m.coins)}</span><span class="rib">${m.name}</span></div>`});
 const hx=(a,ic,t)=>`<div class="slot"><button class="hexb" data-a="${a}"><i>${ic}</i></button><span class="rib">${t}</span></div>`;
 h+=`<div class="menu">${hx('mv','🔧','Двигать')}${hx('sl','🪙','Продать +'+HOUSES[p.type].cost/2)}${hx('ca','🧪','Собрать все: '+total())}</div>`;
 el.innerHTML=h}
$('ov').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,p=sel&&pens.find(p=>p.id===sel.id);
 if(a[0]==='m'){const m=mons.find(m=>m.id==a.slice(1));collect([m]);m.anim='atk';m.t=0}
 else if(a==='ca')collect(mons);
 else if(a==='mv'&&p){moving=p;build=null;sel=null;say('Ведите пальцем и отпустите там, где встанет жилище.');hud()}
 else if(a==='sl'&&p){const g=penCoins(p);mons.forEach(m=>{if(m.pen===p.id){gold+=Math.floor(m.coins);m.coins=0;m.pen=null;pick(m)}});gold+=HOUSES[p.type].cost/2;pens=pens.filter(x=>x!==p);sel=null;save();hud()}};
function sheetR(mode){sheet=mode;const s=$('sheet');s.classList.toggle('on',!!mode);if(!mode)return;
 s.innerHTML=mode==='shop'?Object.entries(HOUSES).map(([k,h])=>`<button data-a="b${k}" ${gold<h.cost?'disabled':''}><b>${h.e}</b>${h.n}<br>${h.cost} 🪙</button>`).join('')+'<button class="wide" data-a="x">Закрыть</button>'
 :'<button class="wide" data-a="rs">Начать заново</button><button class="wide" data-a="x">Закрыть</button>'}
$('sheet').onclick=e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
 if(a==='x')return sheetR(null);
 if(a==='rs'){if(confirm('Начать заново? Прогресс будет удалён.')){fresh();save();say('');sheetR(null);hud()}return}
 if(a[0]==='b'){build=a.slice(1);moving=null;sel=null;sheetR(null);say('Ведите пальцем по полу и отпустите: жилище 3×3 встанет туда.');hud()}};
$('bs').onclick=()=>sheetR(sheet==='shop'?null:'shop');$('bm').onclick=()=>sheetR(sheet==='menu'?null:'menu');
function bar(l,v,max){return `<div class="bar"><span>${l}</span><i><s style="width:${Math.min(100,v/max*100)}%"></s></i><span>${v}</span></div>`}
function panel(){const P_=$('panel');
 if(sel&&sel.t==='m'){const m=mons.find(x=>x.id===sel.id);if(!m){sel=null;return panel()}const k=KINDS[m.kind],p=pens.find(p=>p.id===m.pen);
  P_.innerHTML=`<h2>${m.name}</h2><div>${k.n}. Ген: ${k.gene}. Сейчас ${mood(m)}${p?' в «'+HOUSES[p.type].n+'»':''}.</div>${bar('Здоровье',k.hp,150)}${bar('Атака',k.atk,20)}${bar('Защита',k.def,15)}${bar('Скорость',k.spd,10)}
  <div class="row"><button class="p" id="b1">${reloc?'Выберите жилище…':'Переселить'}</button>${p?'<button id="b2">Выгнать на пол</button>':''}</div>`;
  $('b1').onclick=()=>{reloc=!reloc;say(reloc?'Коснитесь жилища со свободным местом.':'');panel()};
  if(p)$('b2').onclick=()=>{m.pen=null;pick(m);reloc=false;save();hud()};
 }else if(sel&&sel.t==='p'){const p=pens.find(p=>p.id===sel.id);if(!p){sel=null;return panel()}const h=HOUSES[p.type],res=mons.filter(m=>m.pen===p.id);
  P_.innerHTML=`<h2>${h.e} ${h.n}</h2><div>Любимец: ${KINDS[h.fav].n}. Мест ${res.length}/${CAP}: ${res.map(m=>m.name).join(', ')||'пусто'}. Коснитесь монстра на полу и нажмите «Переселить», чтобы заселить его.</div>`;
 }else P_.innerHTML=`<h2>Питомник</h2><div>Откройте «Магазин», постройте жилище и заселите монстров. В любимом жилище монстр доволен и копит монеты: коснитесь жилища и собирайте их по одному или «Собрать все». Коснитесь монстра, чтобы увидеть характеристики.</div>`}
function pt(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width*CW,(e.clientY-r.top)/r.height*CH]}
function setGhost(e){const[x,y]=pt(e),[c,r]=tileAt(x,y);ghost=[cl(c-1,0,N-PEN),cl(r-1,0,N-PEN)]}
cv.addEventListener('pointermove',e=>{if(build||moving)setGhost(e)});
cv.addEventListener('pointerleave',()=>{if(!(build||moving))ghost=null});
cv.addEventListener('pointerup',e=>{if(!(build||moving)||!ghost)return;const[bc,br]=ghost;
 if(!fits(bc,br,moving))return say('Здесь занято — отпустите в другом месте.');
 if(moving){moving.c=bc;moving.r=br;mons.forEach(m=>{if(m.pen===moving.id){m.c=bc+1.5;m.r=br+1.8;pick(m)}});sel={t:'p',id:moving.id};moving=null;say('');save();hud();return}
 const h=HOUSES[build];if(gold<h.cost)return say('Не хватает монет.');
 gold-=h.cost;const p={id:uid++,type:build,c:bc,r:br};pens.push(p);build=null;ghost=null;sel={t:'p',id:p.id};say('');save();hud()});
cv.addEventListener('pointerdown',e=>{sheetR(null);if(build||moving)return setGhost(e);
 const[x,y]=pt(e),[c,r]=tileAt(x,y),pen=pens.find(p=>c>=p.c&&c<p.c+PEN&&r>=p.r&&r<p.r+PEN);
 if(reloc&&sel&&sel.t==='m'){if(!pen)return say('Нужно коснуться жилища.');
  if(mons.filter(m=>m.pen===pen.id).length>=CAP)return say('В этом жилище нет мест.');
  const m=mons.find(m=>m.id===sel.id);m.pen=pen.id;pick(m);reloc=false;say(HOUSES[pen.type].fav===m.kind?'Это его любимое место!':'Селится, но ему здесь не по душе.');save();hud();return}
 let best=null,bd=28;mons.forEach(m=>{const[mx,my]=P(m.c,m.r),d=Math.hypot(mx-x,my-20-y);if(d<bd){bd=d;best=m}});
 if(best){sel={t:'m',id:best.id};best.anim='atk';best.t=0}else if(pen)sel={t:'p',id:pen.id};else sel=null;
 reloc=false;say('');hud()});
function quad(c,r,w,k,h){const a=P(c+k,r+k),b=P(c+w-k,r+k),d=P(c+w-k,r+w-k),e=P(c+k,r+w-k);ctx.beginPath();ctx.moveTo(a[0],a[1]-(h||0));ctx.lineTo(b[0],b[1]-(h||0));ctx.lineTo(d[0],d[1]-(h||0));ctx.lineTo(e[0],e[1]-(h||0));ctx.closePath()}
function tube(x,y){ctx.fillStyle='#3b4456';ctx.fillRect(x-9,y-60,18,5);ctx.fillRect(x-9,y-12,18,5);ctx.fillStyle='rgba(110,255,150,.3)';ctx.fillRect(x-7,y-55,14,43);ctx.fillStyle='#62ff95';ctx.globalAlpha=.7;ctx.fillRect(x-4,y-40,8,26);ctx.globalAlpha=1;ctx.fillStyle='#d8ffe6';ctx.beginPath();ctx.arc(x-1,y-30,1.5,0,7);ctx.arc(x+2,y-22,1.2,0,7);ctx.fill()}
function walls(){for(let k=0;k<N;k++){
 for(const side of [0,1]){const a=side?P(k,0):P(0,k),b=side?P(k+1,0):P(0,k+1);
  ctx.fillStyle=(k+side)%2?'#2d3547':'#262d3d';ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.lineTo(b[0],b[1]-WH);ctx.lineTo(a[0],a[1]-WH);ctx.fill();
  ctx.fillStyle=side?'#32405a':'#3a4a66';ctx.beginPath();ctx.moveTo(a[0],a[1]-30);ctx.lineTo(b[0],b[1]-30);ctx.lineTo(b[0],b[1]-37);ctx.lineTo(a[0],a[1]-37);ctx.fill();
  ctx.strokeStyle='#161b27';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(a[0],a[1]-WH);ctx.stroke();
  if(k%3===1)tube((a[0]+b[0])/2,(a[1]+b[1])/2);
  if(k%3===2){ctx.fillStyle='#1a2030';ctx.fillRect((a[0]+b[0])/2-8,(a[1]+b[1])/2-70,16,10);ctx.fillStyle='#46e0f0';ctx.globalAlpha=.6;ctx.fillRect((a[0]+b[0])/2-6,(a[1]+b[1])/2-68,12,6);ctx.globalAlpha=1}}}
 ctx.strokeStyle='#3fe0f0';ctx.lineWidth=2;ctx.beginPath();const L=P(0,N),B=P(N,N),R=P(N,0),O=P(0,0);ctx.moveTo(...L);ctx.lineTo(...O);ctx.lineTo(...R);ctx.stroke()}
function drawPen(p,g,ok){const c=p.c,r=p.r;ctx.save();if(g)ctx.globalAlpha=.7;
 quad(c,r,PEN,0);ctx.fillStyle=g&&!ok?'#c8344f':'#4a2468';ctx.fill();
 quad(c,r,PEN,.12);ctx.fillStyle=g&&!ok?'#e0566f':'#6a3a8c';ctx.fill();
 ctx.strokeStyle='#a97fd8';ctx.lineWidth=1.5;quad(c,r,PEN,.45);ctx.stroke();quad(c,r,PEN,.9);ctx.stroke();
 const[x,y]=P(c+1.5,r+1.5);ctx.fillStyle='rgba(120,255,160,.25)';ctx.beginPath();ctx.ellipse(x,y,18,9,0,0,7);ctx.fill();
 if(!g){ctx.strokeStyle='#15131f';ctx.lineWidth=3;[[.4,2.8],[2.8,.4],[2.9,2.2]].forEach(q=>{const a=P(c+.8,r+.8),b=P(c+q[0],r+q[1]),m=[(a[0]+b[0])/2,(a[1]+b[1])/2+12];ctx.beginPath();ctx.moveTo(...a);ctx.quadraticCurveTo(m[0],m[1],b[0],b[1]);ctx.stroke()})}
 if(!g&&(sel&&sel.t==='p'&&sel.id===p.id)){quad(c,r,PEN,0);ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.stroke()}
 ctx.restore()}
function drawPod(p){const h=HOUSES[p.type],[x,y]=P(p.c+.8,p.r+.8),n=penCoins(p);
 ctx.fillStyle='#2a2f3c';ctx.beginPath();ctx.ellipse(x,y,16,8,0,0,7);ctx.fill();
 ctx.fillStyle='#6d7889';ctx.fillRect(x-12,y-16,24,14);
 ctx.fillStyle=h.col;ctx.globalAlpha=.9;ctx.beginPath();ctx.arc(x,y-16,12,Math.PI,0);ctx.fill();ctx.globalAlpha=1;
 ctx.font='13px sans-serif';ctx.textAlign='center';ctx.fillText(h.e,x,y-5);
 if(n>0){ctx.font='14px sans-serif';ctx.fillText('🪙',x-9,y-36);ctx.font='bold 13px Oswald,sans-serif';ctx.strokeStyle='#140e22';ctx.lineWidth=3;ctx.fillStyle='#fff';ctx.strokeText(n,x+9,y-35);ctx.fillText(n,x+9,y-35)}}
function drawM(m){const s=SPR[m.kind],a=s[m.anim],im=IMG[m.kind][m.anim];if(!im.complete)return;const[x,y]=P(m.c,m.r);
 const fps={idle:6,walk:10,atk:12}[m.anim],fr=Math.floor(m.t*fps)%a.n;
 ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(x,y,s.w*S*.35,5,0,0,7);ctx.fill();
 if(sel&&sel.t==='m'&&sel.id===m.id){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y,s.w*S*.45,7,0,0,7);ctx.stroke()}
 ctx.save();ctx.translate(x,y);ctx.scale(m.dir,1);ctx.drawImage(im,fr*s.w,0,s.w,s.h,-s.w*S/2,-s.h*S,s.w*S,s.h*S);ctx.restore();
 if(!m.pen){ctx.font='14px sans-serif';ctx.textAlign='center';ctx.fillText('💤',x+22,y-s.h*S)}}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 mons.forEach(m=>{m.t+=dt;if(m.anim==='atk'){if(m.t*12>=SPR[m.kind].atk.n){m.anim='idle';m.t=0}return}
  m.atkT-=dt;if(m.atkT<=0&&m.pen){m.atkT=rnd(8,16);m.anim='atk';m.t=0;return}
  if(m.wait>0){m.wait-=dt;m.anim='idle';return}
  const dc=m.tc-m.c,dr=m.tr-m.r,d=Math.hypot(dc,dr);
  if(d<.05){m.wait=rnd(1,3.5);pick(m);m.anim='idle';m.t=0}else{if(m.anim!=='walk'){m.anim='walk';m.t=0}const v=.35+KINDS[m.kind].spd*.04;m.c+=dc/d*v*dt;m.r+=dr/d*v*dt;if(Math.abs(dc-dr)>.02)m.dir=dc-dr>0?1:-1}});
 incT+=dt;if(incT>=3){incT=0;mons.forEach(m=>{const c=comfort(m);m.coins=Math.min(MCAP,m.coins+(c===100?1:c>=50?.4:0))});
  document.querySelectorAll('[data-b]').forEach(b=>{const m=mons.find(m=>m.id==b.dataset.b);if(m)b.textContent='✋'+Math.floor(m.coins)});$('ov').querySelector('[data-a="ca"]')?.nextElementSibling&&($('ov').querySelector('[data-a="ca"]').nextElementSibling.textContent='Собрать все: '+total())}
 ctx.setTransform(2,0,0,2,0,0);ctx.imageSmoothingEnabled=false;ctx.fillStyle='#12101a';ctx.fillRect(0,0,CW,CH);
 walls();
 const E=10,L=P(0,N),B=P(N,N),R=P(N,0);
 ctx.fillStyle='#454b57';ctx.beginPath();ctx.moveTo(...L);ctx.lineTo(...B);ctx.lineTo(B[0],B[1]+E);ctx.lineTo(L[0],L[1]+E);ctx.fill();
 ctx.fillStyle='#343944';ctx.beginPath();ctx.moveTo(...B);ctx.lineTo(...R);ctx.lineTo(R[0],R[1]+E);ctx.lineTo(B[0],B[1]+E);ctx.fill();
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){quad(c,r,1,0);ctx.fillStyle=(r+c)%2?'#737d90':'#6a7487';ctx.fill();ctx.strokeStyle='#4b5364';ctx.lineWidth=1;ctx.stroke()}
 ctx.strokeStyle='#3fe0f0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(...L);ctx.lineTo(...B);ctx.lineTo(...R);ctx.stroke();
 pens.forEach(p=>drawPen(p));
 const mode=build||moving;if(mode&&ghost)drawPen({type:build||moving.type,c:ghost[0],r:ghost[1]},true,fits(ghost[0],ghost[1],moving)&&(moving||gold>=HOUSES[build].cost));
 const items=[];pens.forEach(p=>items.push({y:P(p.c+.8,p.r+.8)[1],f:()=>drawPod(p)}));mons.forEach(m=>items.push({y:P(m.c,m.r)[1],f:()=>drawM(m)}));
 items.sort((a,b)=>a.y-b.y).forEach(i=>i.f());
 requestAnimationFrame(frame)}
function rs(){$('stage').style.setProperty('--u',cv.clientWidth/CW)}
addEventListener('resize',rs);rs();
if(!load())fresh();hud();say('Откройте «Магазин» и постройте первое жилище.');requestAnimationFrame(frame);setTimeout(rs,300);
</script></body></html>
