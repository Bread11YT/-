<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Выживач — прототип</title>
<style>
:root{--bg:#10121c;--panel:#1c2033;--fg:#f1ede4;--mut:#9aa0b8;--ac:#ffcf5a;--hp:#e8505b;--xp:#5ad1ff;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:600 15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 0;pointer-events:none}
.bar{height:10px;background:#0007;border-radius:5px;overflow:hidden;margin-bottom:5px}
.bar i{display:block;height:100%;width:0;background:var(--xp)}
#hpb i{background:var(--hp)}
#info{display:flex;justify-content:space-between;font-size:14px;text-shadow:0 1px 2px #000}
#dash{position:fixed;right:calc(env(safe-area-inset-right,0px) + 22px);bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:84px;height:84px;border-radius:50%;border:3px solid var(--ac);background:#1c2033cc;color:var(--ac);font:700 13px system-ui,sans-serif;display:none}
.scr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#0a0c14e0;text-align:center;padding:20px}
.scr.on{display:flex}
h1{margin:0;font-size:32px}
p{margin:0;color:var(--mut);max-width:420px;font-weight:500}
.big{background:var(--ac);color:#1a1405;border:0;border-radius:12px;padding:14px 30px;font:800 17px system-ui,sans-serif}
.big:disabled{opacity:.5}
#cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.card{width:150px;background:var(--panel);border:2px solid #343a5a;border-radius:12px;padding:12px;color:var(--fg);text-align:left;font:inherit}
.card b{display:block;color:var(--ac);margin-bottom:4px}
.card span{font-size:13px;color:var(--mut);font-weight:500}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div class="bar" id="hpb"><i></i></div><div class="bar" id="xpb"><i></i></div>
<div id="info"><span id="lv"></span><span id="tm"></span><span id="kl"></span></div></div>
<button id="dash">РЫВОК</button>
<div class="scr on" id="s-start"><h1>Выживач</h1>
<p>Двигайся: WASD / стрелки или стик пальцем. Рывок: Пробел или кнопка. Стреляешь автоматически — выживай и собирай кристаллы.</p>
<button class="big" id="play" disabled>Загрузка…</button></div>
<div class="scr" id="s-up"><h1>Новый уровень!</h1><p>Выбери улучшение (клавиши 1–3)</p><div id="cards"></div></div>
<div class="scr" id="s-over"><h1>Конец забега</h1><p id="stats"></p><button class="big" id="again">Ещё раз</button></div>

const rnd=(a,b)=>a+Math.random()*(b-a);
const DIRMAP=[5,0,1,2,3,4],DASH=.26,JUMP=.55;

function newGame(){return{t:0,kills:0,lvl:1,xp:0,need:5,pend:0,state:'play',
 p:{x:0,y:0,hp:100,max:100,spd:62,face:0,fx:0,fy:1,inv:0,dashT:0,dashCd:0,dvx:0,dvy:0,anim:'idle',at:0,jump:0},

 en:[],pr:[],gem:[],fx:[],spawn:0,shake:0,ups:{},cur:[]}}
function dirIdx(x,y){let a=Math.atan2(y,x)*180/Math.PI;if(a<0)a+=360;let k=Math.round((a-30)/60);return DIRMAP[((k%6)+6)%6]}
/* ввод */
const keys={},joy={on:false,id:-1,ox:0,oy:0,x:0,y:0,vx:0,vy:0};
addEventListener('keydown',e=>{keys[e.code]=1;
 if(e.code==='Space'||e.code==='ShiftLeft'||e.code==='ShiftRight')tryDash();
 if(G&&G.state==='levelup'&&/^Digit[1-3]$/.test(e.code))pick(+e.code[5]-1);
 if(e.code==='Space'||e.code.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>keys[e.code]=0);
const JR=48,COARSE=matchMedia('(pointer:coarse)').matches;
function jbase(){joy.ox=Math.min(90,innerWidth*.25);joy.oy=innerHeight-110}
function jmove(){jbase();let dx=joy.x-joy.ox,dy=joy.y-joy.oy;const l=Math.hypot(dx,dy);
 if(l>JR){dx=dx/l*JR;dy=dy/l*JR;joy.x=joy.ox+dx;joy.y=joy.oy+dy}
 if(l<7){joy.vx=joy.vy=0}else{joy.vx=dx/JR;joy.vy=dy/JR}}
cv.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'||joy.on||e.clientX>innerWidth*.6)return;joy.on=true;joy.id=e.pointerId;joy.x=e.clientX;joy.y=e.clientY;jmove();cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!joy.on||e.pointerId!==joy.id)return;joy.x=e.clientX;joy.y=e.clientY;jmove()});
const jend=e=>{if(e.pointerId===joy.id){joy.on=false;joy.vx=joy.vy=0}};
cv.addEventListener('pointerup',jend);cv.addEventListener('pointercancel',jend);
$('dash').addEventListener('pointerdown',e=>{e.preventDefault();tryDash()});
function input(){let x=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),y=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
 if(!x&&!y){x=joy.vx;y=joy.vy}const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}return[x,y]}
function tryDash(){if(!G||G.state!=='play')return;const p=G.p;if(p.dashCd>0||p.dashT>0)return;
 let[x,y]=input();if(!x&&!y){x=p.fx;y=p.fy}const l=Math.hypot(x,y)||1;
 p.dvx=x/l*240;p.dvy=y/l*240;p.dashT=DASH;p.dashCd=G.dashCdMax;p.inv=Math.max(p.inv,DASH+.12);p.at=0}
/* игра */
function spark(x,y,c,n){for(let i=0;i<n;i++){const a=rnd(0,6.28),s=rnd(15,50);G.fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rnd(.25,.5),c})}}
function stepFx(dt){for(const f of G.fx){f.x+=f.vx*dt;f.y+=f.vy*dt;f.l-=dt}G.fx=G.fx.filter(f=>f.l>0)}
function spawnEnemy(){const t=G.t;let k='slime';const r=Math.random();
 if(t>55&&r<.15)k='brute';else if(t>25&&r<.4)k='bat';
 const T=TY[k],a=rnd(0,6.283),R=Math.hypot(VW,VH)/2+24,hp=T.hp*(1+t/80);
 G.en.push({k,x:G.p.x+Math.cos(a)*R,y:G.p.y+Math.sin(a)*R,hp,r:T.r,sp:T.sp*rnd(.9,1.1),dm:T.dm,c:T.c,xp:T.xp,kx:0,ky:0,flash:0,ph:rnd(0,6)})}
function nearest(p,rng){let b=null,bd=rng*rng;for(const e of G.en){if(e.hp<=0)continue;const d=(e.x-p.x)**2+(e.y-p.y)**2;if(d<bd){bd=d;b=e}}return b}
function fire(t){const p=G.p,w=G.w,a0=Math.atan2(t.y-(p.y-10),t.x-p.x);
 for(let i=0;i<w.n;i++){const a=a0+(i-(w.n-1)/2)*.16;G.pr.push({x:p.x,y:p.y-10,vx:Math.cos(a)*230,vy:Math.sin(a)*230,dmg:w.dmg,pierce:w.pierce,life:1.1,hit:new Set()})}}
function update(dt){
 const p=G.p;
 if(G.state==='dying'){p.at+=dt;stepFx(dt);if(p.at>1.3)endGame();return}
 G.t+=dt;G.shake=Math.max(0,G.shake-dt*20);
 p.inv=Math.max(0,p.inv-dt);p.dashCd=Math.max(0,p.dashCd-dt);p.jump=Math.max(0,p.jump-dt);
 const[ix,iy]=input(),mv=ix||iy;
 if(p.dashT>0){p.dashT-=dt;p.x+=p.dvx*dt;p.y+=p.dvy*dt}else{p.x+=ix*p.spd*dt;p.y+=iy*p.spd*dt}
 if(mv){p.fx=ix;p.fy=iy}
 if(p.dashT>0)p.face=dirIdx(p.dvx,p.dvy);else if(mv)p.face=dirIdx(ix,iy);
 p.anim=p.dashT>0?'dash':p.jump>0?'jump':mv?'walk':'idle';
 const w=G.w;w.t-=dt;
 if(w.t<=0){const t=nearest(p,w.rng);if(t){w.t=w.cd;fire(t)}else w.t=.05}
 G.spawn-=dt;
 if(G.spawn<=0&&G.en.length<220){G.spawn=Math.max(.16,1-G.t*.007);const n=1+Math.floor(G.t/45);for(let i=0;i<n;i++)spawnEnemy()}
 const E=G.en;
 for(const e of E){const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;
  e.x+=(dx/d*e.sp+e.kx)*dt;e.y+=(dy/d*e.sp+e.ky)*dt;const k=Math.exp(-9*dt);e.kx*=k;e.ky*=k;e.flash-=dt;
  if(d>520){e.hp=0;e.far=1;continue}
  if(d<e.r+4&&p.inv<=0){p.hp-=e.dm;p.inv=.7;G.shake=3;spark(p.x,p.y-10,'#e8505b',6);e.kx=-dx/d*120;e.ky=-dy/d*120;
   if(p.hp<=0){p.hp=0;G.state='dying';p.anim='death';p.at=0;return}}}
 for(let i=0;i<E.length;i++){const a=E[i];for(let j=i+1;j<E.length;j++){const b=E[j],dx=b.x-a.x;if(dx>24||dx<-24)continue;
  const dy=b.y-a.y,m=a.r+b.r-2,d2=dx*dx+dy*dy;
  if(d2<m*m&&d2>.01){const d=Math.sqrt(d2),f=(m-d)*.5/d;a.x-=dx*f;a.y-=dy*f;b.x+=dx*f;b.y+=dy*f}}}
 for(const q of G.pr){q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;
  for(const e of E){if(e.hp<=0||q.hit.has(e))continue;
   if((e.x-q.x)**2+(e.y-q.y)**2<(e.r+3)**2){e.hp-=q.dmg;e.flash=.08;e.kx=q.vx*.25;e.ky=q.vy*.25;q.hit.add(e);
    if(q.pierce--<=0){q.dead=1;break}}}}
 for(const e of E)if(e.hp<=0&&!e.dead){e.dead=1;if(!e.far){G.kills++;G.gem.push({x:e.x,y:e.y,v:e.xp});spark(e.x,e.y,e.c,7)}}
 G.en=E.filter(e=>!e.dead);G.pr=G.pr.filter(q=>!q.dead&&q.life>0);
 for(const g of G.gem){const dx=p.x-g.x,dy=p.y-g.y,d=Math.hypot(dx,dy)||1;
  if(d<G.mag)g.mg=1;if(g.mg){g.x+=dx/d*170*dt;g.y+=dy/d*170*dt}if(d<6){g.got=1;G.xp+=g.v}}
 G.gem=G.gem.filter(g=>!g.got);
 while(G.xp>=G.need){G.xp-=G.need;G.lvl++;G.need=Math.round(G.need*1.3+3);G.pend++}
 stepFx(dt);
 if(G.pend>0)showCards();
}
function showCards(){G.state='levelup';
 const pool=UPS.slice().sort(()=>Math.random()-.5).slice(0,3);G.cur=pool;
 const box=$('cards');box.textContent='';
 pool.forEach((u,i)=>{const b=document.createElement('button');b.className='card';
  const t=document.createElement('b'),s=document.createElement('span'),lv=G.ups[u.n]||0;
  t.textContent=(i+1)+'. '+u.n+(lv?' (ур. '+(lv+1)+')':'');s.textContent=u.d;b.append(t,s);
  b.onclick=()=>pick(i);box.append(b)});
 $('s-up').classList.add('on')}
function pick(i){const u=G.cur[i];if(!u)return;u.f(G);G.ups[u.n]=(G.ups[u.n]||0)+1;G.pend--;
 G.p.jump=JUMP;G.p.inv=Math.max(G.p.inv,1);G.p.hp=Math.min(G.p.max,G.p.hp+10);
 $('s-up').classList.remove('on');
 if(G.pend>0)showCards();else G.state='play'}
const fmt=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');
function endGame(){G.state='over';let best=0;
 try{best=+localStorage.getItem('surv-best')||0;if(G.t>best){best=G.t;localStorage.setItem('surv-best',String(G.t))}}catch(e){best=Math.max(best,G.t)}
 $('stats').textContent='Время: '+fmt(G.t)+' · Убито: '+G.kills+' · Уровень: '+G.lvl+' · Рекорд: '+fmt(best);
 $('s-over').classList.add('on')}
function startGame(){G=newGame();['s-start','s-over','s-up'].forEach(i=>$(i).classList.remove('on'));
 if(matchMedia('(pointer:coarse)').matches)$('dash').style.display='block'}
$('play').onclick=function(){this.blur();startGame()};$('again').onclick=function(){this.blur();startGame()};
/* отрисовка */
const hash=(x,y)=>{const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s)};
function ground(cx,cy){const T=16,x0=Math.floor(cx/T),y0=Math.floor(cy/T);
 for(let ty=y0;ty<=y0+Math.ceil(VH/T)+1;ty++)for(let tx=x0;tx<=x0+Math.ceil(VW/T)+1;tx++){const h=hash(tx,ty);
  ctx.fillStyle=h<.5?'#1d2b2a':h<.8?'#203130':'#1a2726';ctx.fillRect(tx*T,ty*T,T,T);
  if(h>.93){ctx.fillStyle='#2f4a3a';ctx.fillRect(tx*T+5,ty*T+7,1,3);ctx.fillRect(tx*T+7,ty*T+6,1,4)}}}
function shadow(x,y,r){ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(x,y,r,r*.4,0,0,7);ctx.fill()}
function pframe(p){const a=p.anim;
 if(a==='dash')return Math.min(7,Math.floor((1-p.dashT/DASH)*8));
 if(a==='jump')return Math.min(7,Math.floor((1-p.jump/JUMP)*8));
 if(a==='death')return Math.min(7,Math.floor(p.at/.14));
 return Math.floor(G.t*(a==='walk'?12:7))%8}
function drawPlayer(p){shadow(p.x,p.y-1,8);
 const img=IMG[p.anim];ctx.globalAlpha=(p.inv>0&&p.dashT<=0&&p.anim!=='death'&&Math.floor(G.t*20)%2)?.45:1;
 ctx.drawImage(img,pframe(p)*48,p.face*64,48,64,Math.round(p.x-24),Math.round(p.y-44),48,64);ctx.globalAlpha=1}
function drawEn(e){const r=e.r,b=Math.sin(e.ph+G.t*(e.k==='bat'?18:7))*1.2,x=e.x,y=e.y-(e.k==='bat'?10:r*.3);
 shadow(e.x,e.y,r*.9);ctx.fillStyle=e.flash>0?'#fff':e.c;
 if(e.k==='bat'){ctx.beginPath();ctx.moveTo(x,y-2);ctx.lineTo(x-r*2,y-4+b*3);ctx.lineTo(x-r*.8,y+2);ctx.lineTo(x+r*.8,y+2);ctx.lineTo(x+r*2,y-4+b*3);ctx.closePath();ctx.fill();ctx.beginPath();ctx.arc(x,y,r*.8,0,7);ctx.fill()}
 else{ctx.beginPath();ctx.ellipse(x,y-b,r,r*.85+b*.3,0,0,7);ctx.fill()}
 if(e.k==='brute'){ctx.beginPath();ctx.moveTo(x-r*.8,y-r*.5);ctx.lineTo(x-r*.5,y-r*1.4);ctx.lineTo(x-r*.1,y-r*.8);ctx.moveTo(x+r*.8,y-r*.5);ctx.lineTo(x+r*.5,y-r*1.4);ctx.lineTo(x+r*.1,y-r*.8);ctx.fill()}
 ctx.fillStyle='#10121c';const ey=Math.round(y-r*.3-b);ctx.fillRect(Math.round(x-r*.5),ey,2,2);ctx.fillRect(Math.round(x+r*.5-2),ey,2,2)}
function render(){
 ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#10121c';ctx.fillRect(0,0,cv.width,cv.height);if(!G)return;
 const p=G.p,s=G.shake,cx=Math.round(p.x-VW/2+(s?rnd(-s,s):0)),cy=Math.round(p.y-14-VH/2+(s?rnd(-s,s):0));
 ctx.setTransform(P,0,0,P,-cx*P,-cy*P);ctx.imageSmoothingEnabled=false;
 ground(cx,cy);
 for(const g of G.gem){ctx.fillStyle='#5ad1ff';ctx.fillRect(Math.round(g.x)-1,Math.round(g.y)-3,3,5);ctx.fillStyle='#c9f1ff';ctx.fillRect(Math.round(g.x),Math.round(g.y)-2,1,2)}
 const L=G.en.map(e=>[e.y,e]);L.push([p.y,p]);L.sort((a,b)=>a[0]-b[0]);
 for(const[,o]of L)o===p?drawPlayer(p):drawEn(o);
 ctx.lineWidth=2;ctx.strokeStyle='#ffe28a';ctx.lineCap='round';
 for(const q of G.pr){ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(q.x-q.vx*.04,q.y-q.vy*.04);ctx.stroke()}
 for(const f of G.fx){ctx.fillStyle=f.c;ctx.fillRect(Math.round(f.x),Math.round(f.y),2,2)}
 ctx.setTransform(1,0,0,1,0,0);
 if(COARSE&&G.state!=='menu'){jbase();const tx=joy.on?joy.x:joy.ox,ty=joy.on?joy.y:joy.oy;
  ctx.strokeStyle='#ffffff55';ctx.lineWidth=3*D;ctx.beginPath();ctx.arc(joy.ox*D,joy.oy*D,JR*D,0,7);ctx.stroke();
  ctx.fillStyle=joy.on?'#ffffff88':'#ffffff44';ctx.beginPath();ctx.arc(tx*D,ty*D,20*D,0,7);ctx.fill()}}
let hc='';
function hud(){if(!G)return;const p=G.p,k=[p.hp|0,p.max,G.xp,G.need,G.lvl,G.t|0,G.kills,p.dashCd>0].join();if(k===hc)return;hc=k;
 $('hpb').firstChild.style.width=(p.hp/p.max*100)+'%';$('xpb').firstChild.style.width=(G.xp/G.need*100)+'%';
 $('lv').textContent='Ур. '+G.lvl+' · HP '+(p.hp|0)+'/'+p.max;$('tm').textContent=fmt(G.t);$('kl').textContent='Убито: '+G.kills;
 $('dash').style.opacity=p.dashCd>0?.45:1}
let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;
 if(G.state==='play'||G.state==='dying')update(dt);else if(G.state==='menu')G.t+=dt;
 render();hud();requestAnimationFrame(loop)}
let n=0;
for(const k in SRC){const i=new Image();i.onload=()=>{if(++n===5){G=newGame();G.state='menu';$('play').disabled=false;$('play').textContent='Играть';requestAnimationFrame(loop)}};i.src=SRC[k];IMG[k]=i}
</script>
